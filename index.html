<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>သင်္ချာ အမြောက် အကွက်ဖြည့် လေ့ကျင့်ခန်း</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pyidaungsu', 'Padauk', sans-serif; }
    body { background-color: #f0f4f8; padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 1050px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
    select { padding: 8px 12px; font-size: 16px; border-radius: 8px; border: 1px solid #3498db; outline: none; font-weight: bold; }
    .score-board { font-size: 16px; font-weight: bold; color: #2c3e50; }
    
    .workspace { display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; margin-top: 10px; }
    .grid-container { flex: 1; min-width: 320px; overflow-x: auto; background: #fafafa; padding: 15px; border-radius: 10px; border: 1px solid #ddd; }
    .draft-container { flex: 1.4; min-width: 380px; background: #fffde7; padding: 15px; border-radius: 10px; border: 1px solid #ffe082; overflow-x: auto; }
    
    table.math-grid { border-collapse: collapse; margin: auto; }
    table.math-grid td { width: 38px; height: 40px; text-align: center; vertical-align: middle; font-size: 20px; font-weight: bold; border: 1px solid #ccc; }
    table.math-grid td.border-bottom { border-bottom: 3px solid #000; }
    
    input.grid-input { width: 100%; height: 100%; text-align: center; font-size: 20px; font-weight: bold; border: none; background: #e8f0fe; color: #1a73e8; outline: none; }
    input.grid-input:focus { background: #fff; box-shadow: inset 0 0 0 2px #1a73e8; }
    input.correct { background: #d4edda !important; color: #155724; }
    input.incorrect { background: #f8d7da !important; color: #721c24; }

    .draft-title { font-weight: bold; color: #f57f17; font-size: 16px; margin-bottom: 10px; border-bottom: 2px solid #fbc02d; padding-bottom: 5px; text-align: center; }
    table.draft-table { border-collapse: collapse; width: 100%; }
    table.draft-table td { padding: 6px; font-size: 13px; border: 1px solid #fff59d; background: #fff; vertical-align: middle; }
    .step-num { font-weight: bold; color: #d81b60; text-align: center; background: #fff9c4 !important; }

    .controls { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
    .btn { padding: 10px 20px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-check { background: #2ecc71; color: white; }
    .btn-next { background: #3498db; color: white; }
    .btn-disabled { background: #b0bec5 !important; color: #78909c !important; cursor: not-allowed !important; opacity: 0.7; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <div>
      <label>အဆင့်ရွေးပါ: </label>
      <select id="levelSelect" onchange="changeLevel()">
        <option value="1">အဆင့် ၁: ခု × ခု (၁၀ ပုဒ်)</option>
        <option value="2">အဆင့် ၂: ဆယ် × ခု (၁၀ ပုဒ်)</option>
        <option value="3">အဆင့် ၃: ဆယ် × ဆယ် (၁၀ ပုဒ်)</option>
        <option value="4">အဆင့် ၄: ရာ × ဆယ် (၁၀ ပုဒ်)</option>
        <option value="5">အဆင့် ၅: ရာ × ရာ (၁၀ ပုဒ်)</option>
        <option value="6">အဆင့် ၆: ထောင် × ရာ (၁၀ ပုဒ်)</option>
        <option value="7">အဆင့် ၇: ထောင် × ထောင် (၁၀ ပုဒ်)</option>
      </select>
    </div>
    <div class="score-board">
      ပုဒ်ရေ: <span id="qIndex">၁</span> / ၁၀
    </div>
  </div>

  <div class="workspace">
    <div class="grid-container">
      <table class="math-grid" id="mathGrid"></table>
    </div>

    <div class="draft-container">
      <div class="draft-title">အကြမ်းတွက် လမ်းညွှန်ချက်များ</div>
      <div id="draftContent"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-check" onclick="checkAnswer()">အဖြေစစ်မည်</button>
    <button class="btn btn-next btn-disabled" id="nextBtn" onclick="nextQuestion()" disabled>နောက်တစ်ပုဒ် ➔</button>
  </div>
</div>

<script>
const mmDigits = ['၀', '၁', '၂', '၃', '၄', '၅', '၆', '၇', '၈', '၉'];
function toMM(n) {
  return n.toString().split('').map(d => mmDigits[d] || d).join('');
}

function normalizeDigit(val) {
  if (!val) return '';
  let str = val.trim();
  let result = '';
  for (let i = 0; i < str.length; i++) {
    let char = str[i];
    let mmIndex = mmDigits.indexOf(char);
    if (mmIndex !== -1) {
      result += mmIndex.toString();
    } else {
      result += char;
    }
  }
  return result;
}

const LEVELS = {
  1: { minA: 1, maxA: 9, minB: 1, maxB: 9 },
  2: { minA: 10, maxA: 99, minB: 1, maxB: 9 },
  3: { minA: 10, maxA: 99, minB: 10, maxB: 99 },
  4: { minA: 100, maxA: 999, minB: 10, maxB: 99 },
  5: { minA: 100, maxA: 999, minB: 100, maxB: 999 },
  6: { minA: 1000, maxA: 9999, minB: 100, maxB: 999 },
  7: { minA: 1000, maxA: 9999, minB: 1000, maxB: 9999 }
};

let currentLevel = 1;
let currentQuestionIndex = 1;
let num1 = 0, num2 = 0;
let isCurrentSolved = false;

function changeLevel() {
  currentLevel = parseInt(document.getElementById('levelSelect').value);
  currentQuestionIndex = 1;
  loadQuestion();
}

function nextQuestion() {
  if (!isCurrentSolved) {
    alert('ဤပုဒ်စာကို မှန်ကန်အောင် အရင်ဖြေဆိုပါ!');
    return;
  }

  if (currentQuestionIndex < 10) {
    currentQuestionIndex++;
    loadQuestion();
  } else {
    alert('ဤအဆင့်အတွက် ၁၀ ပုဒ် ဖြေဆိုပြီးပါပြီ။ နောက်အဆင့်သို့ ကူးပြောင်းနိုင်ပါသည်။');
  }
}

function loadQuestion() {
  isCurrentSolved = false;
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = true;
  nextBtn.classList.add('btn-disabled');

  document.getElementById('qIndex').innerText = toMM(currentQuestionIndex);
  const cfg = LEVELS[currentLevel];
  num1 = Math.floor(Math.random() * (cfg.maxA - cfg.minA + 1)) + cfg.minA;
  num2 = Math.floor(Math.random() * (cfg.maxB - cfg.minB + 1)) + cfg.minB;

  renderGrid();
  renderDraft();
}

function renderGrid() {
  const grid = document.getElementById('mathGrid');
  grid.innerHTML = '';
  
  const str1 = num1.toString();
  const str2 = num2.toString();
  const d2List = str2.split('').map(Number);
  
  const totalSum = num1 * num2;
  const maxCols = totalSum.toString().length + 1;

  // Row 1: Num 1
  let r1 = grid.insertRow();
  fillRowText(r1, str1, maxCols);

  // Row 2: Num 2 with Multiplier
  let r2 = grid.insertRow();
  fillRowText(r2, 'x' + str2, maxCols, true);

  // Partial Product Rows
  if (str2.length > 1) {
    d2List.reverse().forEach((d, rIdx) => {
      let r = grid.insertRow();
      let valStr = (num1 * d).toString() + '0'.repeat(rIdx);
      fillRowInput(r, valStr, maxCols, rIdx === d2List.length - 1);
    });
  }

  // Final Sum Row
  let rFinal = grid.insertRow();
  fillRowInput(rFinal, totalSum.toString(), maxCols, false);
}

function fillRowText(row, str, maxCols, isBorder = false) {
  const pad = maxCols - str.length;
  for (let i = 0; i < maxCols; i++) {
    let cell = row.insertCell();
    if (isBorder) cell.classList.add('border-bottom');
    if (i >= pad) {
      let char = str[i - pad];
      cell.innerText = char === 'x' ? '×' : toMM(char);
    }
  }
}

function fillRowInput(row, targetValStr, maxCols, isBorder) {
  const pad = maxCols - targetValStr.length;
  for (let i = 0; i < maxCols; i++) {
    let cell = row.insertCell();
    if (isBorder) cell.classList.add('border-bottom');
    if (i >= pad) {
      let expectedDigit = targetValStr[i - pad];
      let input = document.createElement('input');
      input.className = 'grid-input';
      input.maxLength = 1;
      input.dataset.expected = expectedDigit;
      cell.appendChild(input);
    }
  }
}

function renderDraft() {
  const container = document.getElementById('draftContent');
  container.innerHTML = '';

  const str1 = num1.toString();
  const str2 = num2.toString();
  const digits1 = str1.split('').map(Number);
  const digits2 = str2.split('').map(Number).reverse();

  let tableHtml = `<table class="draft-table">`;

  digits2.forEach((d2) => {
    let carry = 0;
    tableHtml += `<tr><td class="step-num" colspan="3">ဂဏန်း ${toMM(d2)} ဖြင့် မြှောက်ခြင်း အဆင့်များ</td></tr>`;

    for (let i = digits1.length - 1; i >= 0; i--) {
      let d1 = digits1[i];
      let prod = d2 * d1;
      let total = prod + carry;
      let isLastDigit = (i === 0);

      let stepText = `<b>${toMM(d2)} × ${toMM(d1)} = ${toMM(prod)}</b>`;
      let calcText = carry > 0 
        ? `မှတ်ထားသည့် <b>${toMM(carry)}</b> နှင့်ပေါင်း <b>${toMM(total)}</b>` 
        : `ပေါင်းရန်မရှိပါ <b>${toMM(total)}</b>`;
      
      let actionText = "";
      if (isLastDigit) {
        actionText = `<b>${toMM(total)}</b> ရေး`;
      } else {
        let writeDigit = total % 10;
        let nextCarry = Math.floor(total / 10);
        actionText = `<b>${toMM(writeDigit)}</b> ရေး၊ <b>${toMM(nextCarry)}</b> မှတ်`;
      }

      tableHtml += `
        <tr>
          <td>${stepText}</td>
          <td>${calcText}</td>
          <td>${actionText}</td>
        </tr>
      `;
      carry = Math.floor(total / 10);
    }
  });

  tableHtml += `</table>`;
  container.innerHTML = tableHtml;
}

function checkAnswer() {
  const inputs = document.querySelectorAll('.grid-input');
  let allCorrect = true;

  inputs.forEach(input => {
    let rawVal = input.value;
    let normalizedVal = normalizeDigit(rawVal);
    let expectedVal = input.dataset.expected;

    if (normalizedVal !== '' && normalizedVal === expectedVal) {
      input.classList.add('correct');
      input.classList.remove('incorrect');
    } else {
      input.classList.add('incorrect');
      input.classList.remove('correct');
      allCorrect = false;
    }
  });

  const nextBtn = document.getElementById('nextBtn');

  if (allCorrect) {
    isCurrentSolved = true;
    nextBtn.disabled = false;
    nextBtn.classList.remove('btn-disabled');
    alert('ဂုဏ်ယူပါတယ်။ အဖြေအားလုံး မှန်ကန်ပါတယ်! 🎉 နောက်တစ်ပုဒ်သို့ ဆက်သွားနိုင်ပါပြီ။');
  } else {
    isCurrentSolved = false;
    nextBtn.disabled = true;
    nextBtn.classList.add('btn-disabled');
    alert('အဖြေအချို့ မှားယွင်းနေပါသည်။ အနီရောင်ပြထားသော အကွက်များကို ပြန်လည်စစ်ဆေးပါ။');
  }
}

loadQuestion();
</script>

</body>
</html>
